[project]
name = "project-intern"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "dotenv>=0.9.9",
    "fastapi>=0.139.1",
    "pillow>=12.3.0",
    "psycopg>=3.3.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "python-dotenv>=1.2.2",
    "redis>=8.0.1",
    "uvicorn>=0.51.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend", "backend/apps"]
python_files = ["test_*.py", "*_test.py"]
django_find_project = true
addopts = "--cov=users --cov-report=term-missing --cov-report=html"


